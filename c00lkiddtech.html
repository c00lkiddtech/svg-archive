<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>c00lkiddtech</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg {
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      display: block;
      border: none;
    }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="position: absolute; top: 0; left: 0; margin: 0; padding: 0; overflow: hidden;" onload="injectLogo()">

  <script type="text/javascript">
    <![CDATA[
    function injectLogo() {
      const container = document.getElementById('logo-container');

      if (container) {
        const logo = document.createElementNS('http://www.w3.org/1999/xhtml', 'iframe');

        logo.setAttribute('src', 'https://c00lkiddtech.live/games');
        logo.style.width = '100%';
        logo.style.height = '100%';
        logo.style.border = 'none';
        logo.style.background = '#0a1220';
        logo.style.margin = '0';
        logo.style.padding = '0';

        container.appendChild(logo);
      }
    }
    ]]>
  </script>

  <foreignObject x="0" y="0" width="100%" height="100%">
    <xhtml:div xmlns:xhtml="http://www.w3.org/1999/xhtml" id="logo-container" style="width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;">
    </xhtml:div>
  </foreignObject>
</svg>
</body>
</html>
